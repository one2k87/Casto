<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casto</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casto">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* Casto v2 — 파스텔 블루 · 스크립토 패밀리 디자인 시스템
     v1 대비: 다음 할 일 중심 구조 / 캡처 번호표 내장 / 터치 타깃 44px / 다크 자동 / 아이콘 우선 */
  :root{
    --bg:#eef4fd; --card:rgba(255,255,255,.62); --card2:rgba(255,255,255,.85);
    --line:rgba(91,141,239,.18); --txt:#2c3a55; --muted:#7f8ca6;
    --ok:#3fae86; --warn:#d99b2e; --danger:#e0708a;
    --accent:#5b8def; --accent-soft:rgba(91,141,239,.14);
    --glow:rgba(143,177,245,.32); --ring:rgba(91,141,239,.5); --radius:14px;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
    --tap:44px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0d13; --card:#10141c; --card2:#171d28; --line:#242c3a;
      --txt:#f2f4f8; --muted:#9aa3b2; --ok:#34d399; --warn:#fbbf24; --danger:#fb7185;
      --accent:#6f9bf2; --accent-soft:rgba(91,141,239,.2); --glow:rgba(91,141,239,.22);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* .btn의 display가 [hidden]을 덮어써서 안 숨겨졌다 */
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
    padding-bottom:calc(28px + var(--safe-b))}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:calc(8px + var(--safe-t)) 12px 8px;
    background:color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
    border-bottom:1px solid var(--line)}
  header img{border-radius:9px}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.025em}
  .sub{font-size:11px;color:var(--muted)}
  .spacer{flex:1}
  main{max-width:560px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin:10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 28px -18px var(--glow)}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:700;
    display:flex;align-items:center;gap:6px}

  /* ① 다음 할 일 */
  .next{display:flex;align-items:center;gap:12px}
  .next .ico{font-size:30px;line-height:1;flex:0 0 auto}
  .next .txt{flex:1;min-width:0}
  .next .t1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .next .t2{font-size:12px;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:var(--tap);padding:0 18px;border-radius:12px;border:0;cursor:pointer;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;
    font-family:inherit;text-decoration:none;width:100%;margin-top:12px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);
    min-height:38px;font-size:13px;font-weight:600;margin-top:8px}
  .btn:active{transform:scale(.985)}

  /* ② 상태 3칸 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--card2);border-radius:12px;padding:12px 8px;text-align:center;
    border:1px solid var(--line)}
  .stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px}

  /* ③ 캡처 번호표 */
  details>summary{list-style:none;cursor:pointer;min-height:var(--tap);display:flex;
    align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:"▾";margin-left:auto;transition:transform .15s}
  details[open]>summary::after{transform:rotate(180deg)}
  .shot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .shot .no{flex:0 0 34px;height:34px;border-radius:10px;background:var(--accent-soft);
    color:var(--accent);font-weight:800;font-size:15px;display:grid;place-items:center}
  .shot .nm{flex:1;min-width:0}
  .shot .nm b{display:block;font-size:14px;font-weight:700;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .shot .nm span{font-size:11px;color:var(--muted)}
  .shot a{flex:0 0 auto;min-width:var(--tap);min-height:var(--tap);border-radius:11px;
    display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);
    text-decoration:none;font-size:17px}
  .chip{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent)}

  /* ④ 바로가기 */
  .row{display:flex;align-items:center;gap:10px;min-height:var(--tap);
    border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--txt)}
  .row:first-of-type{border-top:0}
  .row .ri{width:24px;text-align:center;font-size:16px;flex:0 0 auto}
  .row small{color:var(--muted);margin-left:auto;font-size:11px}

  .appsw{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--card2);flex:0 0 auto}
  .appsw a{display:grid;place-items:center;width:38px;height:38px;font-size:13px;
    font-weight:800;text-decoration:none;color:var(--muted)}
  .appsw a+a{border-left:1px solid var(--line)}
  .appsw a.on{background:var(--accent-soft);color:var(--accent)}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:10px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}
  .skeleton{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <img src="icons/icon-192.png" alt="" width="30" height="30" onerror="this.style.display='none'">
  <div><h1>Casto</h1><div class="sub">콕픽 · 유행템 쇼츠</div></div>
  <div class="spacer"></div>
  <nav class="appsw" aria-label="앱 전환">
    <a href="https://one2k87.github.io/Scripto/dashboard/" aria-label="Scripto">S</a
    ><a href="https://one2k87.github.io/Picto/dashboard/" aria-label="Picto">P</a
    ><a class="on" href="#" aria-current="page" aria-label="Casto (현재)" onclick="return false">C</a
    ><a href="https://one2k87.github.io/Markto/dashboard/" aria-label="Markto">M</a>
  </nav>
</header>
<main>
  <!-- ① 다음 할 일 — 앱을 열면 이것 하나만 보면 된다 -->
  <div class="card" id="nextCard">
    <h2>다음 할 일</h2>
    <div class="next">
      <div class="ico" id="nextIco">⏳</div>
      <div class="txt"><div class="t1" id="nextT1">확인 중…</div>
        <div class="t2" id="nextT2">데이터를 불러오고 있습니다</div></div>
    </div>
    <a class="btn" id="nextBtn" hidden></a>
    <button class="btn ghost" id="doneBtn" hidden>오늘 업로드 완료로 표시</button>
  </div>

  <!-- ② 오늘 상태 -->
  <div class="card">
    <h2>오늘</h2>
    <div class="stats">
      <div class="stat"><div class="n" id="sShort">—</div><div class="l">🎬 쇼츠</div></div>
      <div class="stat"><div class="n" id="sShot">—</div><div class="l">📸 캡처 대기</div></div>
      <div class="stat"><div class="n" id="sSubs">—</div><div class="l">👥 구독</div></div>
    </div>
  </div>

  <!-- ③ 캡처 번호표 — 매일 반복하는 유일한 손작업이라 앱 안에 둔다 -->
  <div class="card">
    <details id="shotWrap">
      <summary>📸 캡처 번호표 <span class="chip" id="shotCount">—</span></summary>
      <div id="shotList" class="skeleton" style="margin-top:6px">불러오는 중…</div>
    </details>
  </div>

  <!-- ④ 바로가기 -->
  <div class="card">
    <h2>바로가기</h2>
    <a class="row" href="https://studio.youtube.com" target="_blank" rel="noopener">
      <span class="ri">🎬</span>유튜브 스튜디오 <small>업로드</small></a>
    <a class="row" href="https://www.youtube.com/@kokpick_kr" target="_blank" rel="noopener">
      <span class="ri">📺</span>콕픽 채널 <small>@kokpick_kr</small></a>
    <a class="row" id="ciRow" href="https://github.com/one2k87/Casto/actions" target="_blank"
       rel="noopener" hidden><span class="ri">⚠️</span>실행 기록 확인 <small>Actions</small></a>
  </div>

  <div class="foot">Casto v2 · <a href="#" id="reload" style="color:inherit">새로고침 ↻</a></div>
</main>
<script>
const RAW = "https://raw.githubusercontent.com/one2k87/Casto/main/";
const $ = id => document.getElementById(id);
const todayKST = () => new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul"}).format(new Date());

async function get(path, asJson){
  const r = await fetch(RAW + path + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error(path + " " + r.status);
  return asJson ? r.json() : (await r.text()).trim();
}
const store = {                                  // 실패해도 화면이 죽지 않게 감싼다
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};

function setNext(ico, t1, t2, btn){
  $("nextIco").textContent = ico; $("nextT1").textContent = t1; $("nextT2").textContent = t2;
  const b = $("nextBtn");
  if(btn){ b.textContent = btn.label; b.hidden = false;
           if(btn.href){ b.href = btn.href; b.target = btn.target || "_blank"; b.onclick = null; }
           else { b.removeAttribute("href"); b.onclick = e => { e.preventDefault(); btn.run(); }; }
  } else b.hidden = true;
}

function renderShots(q){
  const items = Object.entries(q.items || {})
    .map(([n,it]) => ({n:+n, ...it}))
    .filter(it => !it.done && !it.hold)
    .sort((a,b) => a.n - b.n);
  $("shotCount").textContent = items.length + "건";
  $("sShot").textContent = items.length;
  $("shotList").className = "";
  const CAP = 8;
  const card = it => {
    const who = it.display || [it.brand, it.model].filter(Boolean).join(" ") || it.name;
    const mark = {"높음":"◎","중간":"○","낮음":"△"}[it.confidence] || "";
    return `<div class="shot"><div class="no">${it.n}</div>
      <div class="nm"><b>${who} ${mark}</b><span>${it.search || it.name} → ${it.n}.png</span></div>
      <a href="${it.url||"#"}" target="_blank" rel="noopener" aria-label="쿠팡에서 열기">🛒</a></div>`;
  };
  $("shotList").innerHTML = items.length
    ? items.slice(0, CAP).map(card).join("")
      + (items.length > CAP
         ? `<div id="shotMore">${items.slice(CAP).map(card).join("")}</div>
            <button class="btn ghost" id="moreBtn">+${items.length - CAP}건 더 보기</button>`
         : "")
    : "<div class='skeleton'>필요한 캡처가 없습니다 👍</div>";
  if(items.length > CAP){
    $("shotMore").hidden = true;
    $("moreBtn").onclick = () => { $("shotMore").hidden = false; $("moreBtn").hidden = true; };
  }
  if(items.length) $("shotWrap").open = true;
  return items.length;
}

(async () => {
  let shortDone = false, waiting = 0, subs = null, videos = null, failed = false;

  try{
    const t = await get("data/last_short.txt");
    shortDone = (t === todayKST());
    $("sShort").textContent = shortDone ? "완료" : "대기";
  }catch(e){ failed = true; $("sShort").textContent = "?"; }

  try{ waiting = renderShots(await get("data/shot_queue.json", true)); }
  catch(e){ failed = true; $("shotList").textContent = "번호표를 불러오지 못했습니다"; $("sShot").textContent="?"; }

  try{
    const s = await get("data/channel_latest.json", true);
    subs = s.subscribers; videos = s.video_count;
    $("sSubs").textContent = subs;
  }catch(e){ $("sSubs").textContent = "—"; }

  // 다음 할 일 — 조건 분기로 **항상 하나만** 정한다
  const uploadedToday = store.get("casto.uploaded") === todayKST();
  if(failed && !shortDone && !waiting){
    setNext("📡", "상태를 확인할 수 없음", "네트워크를 확인하고 다시 시도하세요",
            {label:"다시 시도", run:() => location.reload()});
    $("ciRow").hidden = false;
  } else if(shortDone && !uploadedToday){
    setNext("🎬", "오늘 영상 업로드", "텔레그램으로 받은 mp4를 올리세요",
            {label:"유튜브 스튜디오 열기", href:"https://studio.youtube.com"});
    $("doneBtn").hidden = false;
  } else if(waiting > 0){
    setNext("📸", `상품 캡처 ${waiting}건`, "쿠팡에서 대표 이미지를 캡처해 번호로 저장",
            {label:"번호표 보기", run:() => { $("shotWrap").open = true;
              $("shotWrap").scrollIntoView({behavior:"smooth", block:"center"}); }});
  } else if(!shortDone){
    setNext("⏳", "오늘 쇼츠 제작 대기", "매일 아침 자동 생성됩니다", null);
  } else {
    setNext("✅", "오늘 할 일 없음", "모두 처리했습니다", null);
  }

  $("doneBtn").onclick = () => {
    store.set("casto.uploaded", todayKST());
    $("doneBtn").hidden = true;
    if(waiting > 0) setNext("📸", `상품 캡처 ${waiting}건`, "쿠팡에서 대표 이미지를 캡처해 번호로 저장",
      {label:"번호표 보기", run:() => { $("shotWrap").open = true;
        $("shotWrap").scrollIntoView({behavior:"smooth", block:"center"}); }});
    else setNext("✅", "오늘 할 일 없음", "모두 처리했습니다", null);
  };
  if(videos === 0) $("ciRow").hidden = false;   // 아직 발행 0편이면 실행기록을 노출
})();

$("reload").onclick = e => { e.preventDefault(); location.reload(); };
// iOS bfcache 복귀 후 고정 헤더가 밀려 못 누르는 현상 보정
addEventListener("pageshow", e => { if(e.persisted){
  requestAnimationFrame(() => { const y=scrollY; scrollTo(0,y+1); scrollTo(0,y); }); }});
if("serviceWorker" in navigator) addEventListener("load",
  () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
