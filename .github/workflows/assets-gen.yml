name: 캐릭터·점토 자산 생성
# 파일럿(블록 0) 1회성 생성 — 픽이 후보 3안, 레퍼런스 시트, 픽이 확정. 키는 시크릿에만 있으니 여기서 돌린다.
# 결과는 assets/에 커밋되고 텔레그램으로 알린다. famto가 받아 사용자에게 보여 준다.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "cands(픽이 3안) | sheet(콕이 시트) | pick(픽이 확정, n 필요)"
        required: true
        default: "cands"
        type: choice
        options: [cands, sheet, pick]
      n:
        description: "pick일 때 후보 번호(1~3)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - name: 생성
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "${{ inputs.job }}" = "pick" ]; then
            python make_pick.py pick "${{ inputs.n }}"
          else
            python make_pick.py "${{ inputs.job }}"
          fi
      - name: 결과 커밋
        run: |
          git config user.name casto-bot && git config user.email casto@solvup.local
          git add -A assets
          if git diff --cached --quiet; then
            echo "::warning::생성된 파일이 없다 — 로그의 [imagegen] 줄을 볼 것"
          else
            git commit -m "assets: ${{ inputs.job }} $(date +%F)"
            git pull --rebase --autostash origin main && git push origin main
          fi
      - name: 텔레그램
        if: ${{ always() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, glob, urllib.parse, urllib.request
          tok, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              raise SystemExit(0)
          n = len(glob.glob("assets/pick/*.png")) + len(glob.glob("assets/koki/*_sheet.png"))
          msg = f"🎨 자산 생성 '${{ inputs.job }}' 끝 — 저장소 assets/ 에 {n}장. famto가 보여 줄게요."
          urllib.request.urlopen("https://api.telegram.org/bot%s/sendMessage" % tok,
              urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode())
          PY
