name: 채널 성과 추적
# 매일 22:20 KST — 구독자·조회수·영상별 성과를 기록한다.
# API 키만으로 동작(공개 데이터). 8주 손절 기준을 자동 판정해 감으로 판단하지 않게 한다.
on:
  schedule:
    - cron: "50 10 * * *"    # 19:50 KST — 앱을 열면 성과가 최신이다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-stats
  cancel-in-progress: false

jobs:
  stats:
    env:
      # 러너는 UTC — KST 새벽 실행이 전날 날짜로 저장돼 스냅샷을 덮어쓰는 것을 막는다(2026-09-09 실측)
      TZ: Asia/Seoul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: 성과 수집
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python channel_stats.py
      # 성과가 갱신된 직후 학습을 돌린다 — 다음 영상 대본이 이 결과를 프롬프트로 받는다
      - name: 학습 루프
        run: python learn.py
      # 정체성 실험: 24h/72h/7d 자리 채우기(매일) + 일요일엔 블록 리뷰를 텔레그램으로
      - name: 실험 갱신
        run: python experiments.py update || true
      # C5 증거(famto 10/30 ⑤): 매주 월요일 evidence/C/<날짜>/summary.json — YPP 확장 관문 진척·비용
      - name: C 증거 수집 (월요일)
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then python evidence_c.py || true; else echo "월요일 아님 — 건너뜀"; fi
      - name: 실험 주간 리뷰 (일요일)
        if: ${{ always() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date +%u)" != "7" ]; then echo "일요일이 아님 — 리뷰 생략"; exit 0; fi
          python experiments.py review > out_review.txt || true
          cat out_review.txt
          python - <<'PY'
          import os, urllib.parse, urllib.request
          tok, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          txt = open("out_review.txt", encoding="utf-8").read().strip() if os.path.exists("out_review.txt") else ""
          if tok and chat and txt:
              urllib.request.urlopen("https://api.telegram.org/bot%s/sendMessage" % tok,
                  urllib.parse.urlencode({"chat_id": chat, "text": txt[:3900]}).encode())
          PY

      - name: 결과 커밋
        run: |
          git add -A evidence 2>/dev/null || true
          git config user.name casto-bot && git config user.email casto@solvup.local
          git add -A data
          if git diff --cached --quiet; then
            echo "::warning::변경 없음 — 수집이 실패했을 수 있다"
          else
            git commit -m "stats: $(date +%F) 채널 성과"
            git pull --rebase --autostash origin main && git push origin main
          fi
