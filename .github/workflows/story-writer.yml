name: 원템포 대본 작가
# 2026-11-17 사용자 지시: 플롯 랜덤 순환(최근 3편 제외)·주기 교체, 진짜 대화 같은 대본, 힐링 + 잔잔한 웃음.
# pilot/story/request.txt 에 "<에피소드 이름> [--plot id] [--topic 소재] [--readthrough]" 한 줄을 적어 푸시하면
# 플롯 교체 주기 확인(story_plots.refresh) → 초안 3편 → 비평·최종본 → pilot/story/<ep>/ 커밋 → 낭독 음성 텔레그램.
on:
  push:
    paths: ["pilot/story/request.txt"]
  workflow_dispatch:
    inputs:
      args:
        description: "<ep> [--plot id] [--topic 소재] [--readthrough]"
        required: true
        default: "ep2 --readthrough"

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests numpy
      - name: 플롯 교체 주기 + 대본
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_WIFE: ${{ vars.ELEVEN_VOICE_WIFE }}
          ELEVEN_VOICE_HUSBAND: ${{ vars.ELEVEN_VOICE_HUSBAND }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LINE="${{ inputs.args }}"
          if [ "${{ github.event_name }}" = "push" ]; then LINE="$(head -1 pilot/story/request.txt)"; fi
          python story_plots.py refresh || true
          python story_writer.py $LINE
      - name: 결과 커밋
        if: ${{ always() }}
        run: |
          git config user.name casto-bot && git config user.email casto@solvup.local
          for p in pilot/story data/plot_bank.json; do [ -e "$p" ] && git add -f "$p"; done; true
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "story: $(head -1 pilot/story/request.txt 2>/dev/null || echo manual) [skip ci]" && git pull --rebase --autostash origin main && git push origin main
          fi
