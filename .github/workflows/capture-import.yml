name: 캡처 반입
# 폰에서 캡처를 올리면(앱이 커밋) **즉시** 카탈로그에 반입한다.
# 사람이 손댄 직후 결과가 보여야 흐름이 끊기지 않는다 — 그래서 push 트리거다.
on:
  push:
    paths:
      - "assets/products/캡처_넣는곳/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow

      - name: 캡처 반입
        run: python capture_import.py

      - name: 결과 커밋
        run: |
          git config user.name casto-bot && git config user.email casto@solvup.local
          git add -A data assets/products
          if git diff --cached --quiet; then
            echo "::notice::반입할 캡처가 없다(이미 처리됨)"
          else
            git commit -m "capture: $(date +%F) 캡처 반입"
            git pull --rebase --autostash origin main && git push origin main
          fi

      - name: 텔레그램 알림
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          tok, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              raise SystemExit(0)
          q = json.load(open("data/shot_queue.json", encoding="utf-8"))
          todo = [i for i in q["items"].values() if not i.get("done") and not i.get("hold")]
          done = [i for i in q["items"].values() if i.get("done")]
          msg = f"📸 캡처 반입 완료 — 등록 {len(done)}건 · 남은 캡처 {len(todo)}건"
          urllib.request.urlopen("https://api.telegram.org/bot%s/sendMessage" % tok,
              urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode())
          PY
