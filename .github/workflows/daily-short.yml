name: 쇼츠 자동 제작
# 픽담 최신 글 → 트렌드 반영 대본 → TTS+ffmpeg 합성 → Make 웹훅으로 유튜브 공개 게시 → 텔레그램 링크.
# 매일 08:00 KST(글 발행 07:00 이후). 시크릿 등록 전 실패 방지를 위해 크론은 주석으로 시작.
on:
  schedule:
    - cron: "40 10 * * *"    # 19:40 KST — 20시에 앉으면 텔레그램에 영상이 도착해 있다
    - cron: "10 12 * * *"    # 백업 21:10 KST — 작업 시간 안이라 미발화를 바로 알아챈다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 중복 실행 가드 (오늘 이미 만들었으면 스킵)
        id: dup
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/last_short.txt ] && [ "$(cat data/last_short.txt)" = "$(TZ=Asia/Seoul date +%F)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "오늘 쇼츠 이미 생성됨 — 백업 크론 스킵"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # 편성 가드: 주 4편(화·목·토·일)만 발행한다. 요일 상한이 곧 양산형 콘텐츠 정책 대응이다.
      # 수동 실행(workflow_dispatch)은 편성과 무관하게 통과시켜 테스트를 막지 않는다.
      - uses: actions/setup-python@v5
        if: steps.dup.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - name: 편성 확인 (오늘 발행일인가)
        id: plan
        if: steps.dup.outputs.skip != 'true'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          PLAN=$(TZ=Asia/Seoul python schedule.py "$TODAY")
          echo "$PLAN"
          # 슬롯은 사람이 읽는 요약을 grep하지 않고 전용 출력으로 받는다 — 문구가 바뀌면
          # grep은 조용히 틀리고, 조용히 틀린 편성은 4일간 아무도 모른다(2026-09-11 사고).
          SLOT=$(TZ=Asia/Seoul python schedule.py --slot "$TODAY")
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "오늘 슬롯: $SLOT"
          if echo "$PLAN" | grep -q "발행 없음" && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            { echo "reason<<EOF"; echo "$PLAN"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 조용히 건너뛰면 "왜 오늘 영상이 없지?"를 사람이 조사하게 된다 → 이유를 폰으로 보낸다
      - name: 발행 건너뜀 알림
        if: steps.plan.outputs.skip == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          tok, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              raise SystemExit(0)
          msg = "🎬 오늘은 발행하지 않습니다\n\n" + (os.getenv("REASON") or "").strip()
          urllib.request.urlopen("https://api.telegram.org/bot%s/sendMessage" % tok,
              urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode())
          PY
      - name: 의존성 (한글 폰트·이모지·ffmpeg 포함)
        if: steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-color-emoji
          pip install requests pillow edge-tts
      # 일요일은 「콕픽 차트」, 나머지는 데일리. 같은 워크플로에서 갈라진다 —
      # 워크플로를 둘로 나누면 중복 가드·게시·알림을 두 벌 유지하게 되고 한쪽이 썩는다.
      - name: 콕픽 차트 제작 (일요일)
        if: steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip != 'true' && steps.plan.outputs.slot == 'chart'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python make_chart.py
      - name: 쇼츠 제작
        if: steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip != 'true' && steps.plan.outputs.slot != 'chart'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKE_UPLOAD_HOOK: ${{ secrets.MAKE_UPLOAD_HOOK }}
        run: python make_short.py
      # 여기가 수익의 시작점이다 — 올라가지 않은 영상의 수익은 0이다 (docs/콕픽_수익화_보고서.md §0).
      # MAKE_UPLOAD_HOOK 시크릿이 없으면 조용히 건너뛰고 텔레그램 mp4 수동 폴백으로 남는다.
      - name: 유튜브 자동 게시 (Make 웹훅)
        if: steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip != 'true'
        env:
          MAKE_UPLOAD_HOOK: ${{ secrets.MAKE_UPLOAD_HOOK }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.plan.outputs.slot }}" = "chart" ]; then
            python publish.py public out/chart.mp4 out/chart_caption.txt
          else
            python publish.py public out/short.mp4 out/caption.txt
          fi
      - name: 성공 마커 커밋 (중복 가드용)
        if: steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip != 'true'
        run: |
          TZ=Asia/Seoul date +%F > data/last_short.txt
          git config user.name casto-bot && git config user.email casto@solvup.local
          git add -A data && git commit -m "marker: $(TZ=Asia/Seoul date +%F) ${{ steps.plan.outputs.slot }} 생성" || true
          git pull --rebase --autostash origin main && git push origin main || true
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYEOF'
          import os, urllib.parse, urllib.request
          tok, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              raise SystemExit(0)
          msg = "⚠️ 오늘 쇼츠가 나가지 않았습니다 — 실행 기록을 확인하세요.\n" + (os.getenv("RUN_URL") or "")
          urllib.request.urlopen("https://api.telegram.org/bot%s/sendMessage" % tok,
              urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode())
          PYEOF

      - name: 결과 보존 (텔레그램 실패 대비 7일)
        if: steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            out/short.mp4
            out/chart.mp4
            out/chart_caption.txt
          if-no-files-found: ignore
          retention-days: 7
