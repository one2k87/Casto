name: 콕이네 집 파일럿
# 블록 0 — 한 편을 끝까지. famto는 pilot/request.txt 에 "<slug> [--no-veo] [--no-llm]" 를 적어 푸시해 돌린다.
# 결과(대본·키프레임·영상·리포트)는 pilot/<date>/ 로 커밋되고 텔레그램으로 영상이 간다. 발행은 하지 않는다.
on:
  push:
    paths: ["pilot/request.txt"]
  workflow_dispatch:
    inputs:
      args:
        description: "<slug> [--no-veo] [--no-llm]"
        required: true
        default: "계란-흰자-분리기"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q requests pillow edge-tts
      - name: 파일럿 제작
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_WIFE: ${{ vars.ELEVEN_VOICE_WIFE }}
          ELEVEN_VOICE_HUSBAND: ${{ vars.ELEVEN_VOICE_HUSBAND }}
          ELEVEN_VOICE_GUIDE: ${{ vars.ELEVEN_VOICE_GUIDE }}
        run: |
          ARGS="${{ inputs.args }}"
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="$(cat pilot/request.txt)"; fi
          echo "args: $ARGS"
          python pilot.py $ARGS
      - name: 결과 커밋 (렌더 중간물 제외)
        if: ${{ always() }}
        run: |
          git config user.name casto-bot && git config user.email casto@solvup.local
          find pilot -path '*/render' -prune -o -type f -print | grep -v request.txt | xargs -r git add -f
          for p in assets/clay assets/cast data/veo_usage.json; do [ -e "$p" ] && git add -A "$p"; done; true
          if git diff --cached --quiet; then echo "::warning::산출물 없음"; else
            git commit -m "pilot: $(date +%F) 콕이네 집" && git pull --rebase --autostash origin main && git push origin main
          fi
      - name: 영상 보존 (7일)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-${{ github.run_id }}
          path: |
            pilot/*/short.mp4
            pilot/*/script.json
            pilot/*/report.json
          retention-days: 7
          if-no-files-found: ignore
