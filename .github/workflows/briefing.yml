name: 콕 브리핑 (보류 — 수동 실행만)
# ⚠️ 2026-09-15 자동 실행 중단. 주간 차트는 **일요일 「콕픽 차트」**(make_chart.py)로 옮겼고
#    daily-short.yml이 편성에 따라 돌린다. 여기서 월요일에 또 만들면 같은 주를 두 번
#    결산하는 꼴이고, 아무도 게시하지 않는 영상이 매주 하나씩 쌓인다.
#    롱폼 3~4분 버전은 아직 차트 편에 없어서 파일을 지우지 않고 수동 실행만 남긴다.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "렌더할 버전"
        type: choice
        options: [both, short, long]
        default: both

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    env:
      # 러너는 UTC — KST 새벽 실행이 전날 날짜로 저장돼 스냅샷을 덮어쓰는 것을 막는다(2026-09-09 실측)
      TZ: Asia/Seoul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - run: pip install requests pillow pytest edge-tts

      - name: 회귀 테스트
        run: python -m pytest -q tests

      - name: 브리핑 렌더
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python make_briefing.py ${{ inputs.variant || 'both' }}

      - name: 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: |
            out/briefing_*.mp4
            out/briefing_*_caption.txt
            out/briefing_script.json
          if-no-files-found: warn
          retention-days: 14
