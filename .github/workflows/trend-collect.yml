name: 제품 트렌드 수집
# 매일 06:10 KST 스냅샷 수집 → 일요일엔 주간 랭킹(재인/구매가치)까지 집계.
# 리뷰 증가·가격 변동은 어제 스냅샷과 비교해야 나오므로 **매일 쌓는 것이 전제**다.
on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      board_only:
        description: "수집 없이 집계만 다시 돌리기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trend-collect
  cancel-in-progress: false

jobs:
  collect:
    env:
      # 러너는 UTC — KST 새벽 실행이 전날 날짜로 저장돼 스냅샷을 덮어쓰는 것을 막는다(2026-09-09 실측)
      TZ: Asia/Seoul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # pillow는 수집 자체엔 불필요하지만, 회귀 테스트가 브리핑 모듈(make_briefing→PIL)을
      # import하므로 필요하다. 빼면 테스트 수집 단계에서 ImportError로 잡한다(2026-09-07 실측).
      - run: pip install requests pillow

      - name: 점수 모델 회귀 테스트
        run: python -m unittest discover -s tests

      - name: 일별 스냅샷 수집
        if: ${{ inputs.board_only != true }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # 레거시(개발자센터, 2027-06-30 만료)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # NAVER API HUB(네이버 클라우드) — 값이 있으면 이쪽을 우선 사용한다
          NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
          NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python trend_products.py collect

      # 일요일(UTC 일 21:10 = KST 월 06:10)에 주간 랭킹 집계 → 월요일 브리핑 소재가 된다
      - name: 주간 랭킹 집계
        if: ${{ github.event_name == 'workflow_dispatch' || format('{0}', github.event.schedule) != '' }}
        run: |
          DOW=$(date -u +%u)   # 7=일요일(UTC)
          if [ "$DOW" = "7" ] || [ "${{ inputs.board_only }}" = "true" ]; then
            python trend_products.py board
          else
            echo "오늘은 집계일이 아님(UTC 일요일에만) — 스냅샷만 저장"
          fi

      # 사람이 assets/products/캡처_넣는곳/ 에 넣어둔 **실제 상품 캡처**를 카탈로그에 반입한다.
      # ⚠️ 제품을 AI로 재현하는 단계는 없다 — 실물과 다른 그림은 시청자가 즉시 알아채고 돌아선다.
      - name: 상품 캡처 반입
        run: python capture_import.py

      # 콕픽이 관측한 유행템을 픽담(픽토)에 글감으로 넘긴다.
      # 영상과 글이 같은 제품을 가리켜야 유입 구조가 실제로 작동한다(2026-09-08 결정).
      - name: 픽담 글감 요청서 갱신
        run: python topic_requests.py

      - name: 결과 커밋
        run: |
          git config user.name casto-bot && git config user.email casto@solvup.local
          # ⚠️ 개별 경로를 나열하면 아직 없는 파일(trend_board/covered) 때문에 pathspec 에러로
          # git add 전체가 실패하고, 그걸 `|| true`가 삼켜 커밋이 조용히 건너뛰어진다.
          # 실제로 run #3에서 수집은 됐는데 결과가 유실됐다(2026-09-07 실측). -A로 통째로 스테이징.
          git add -A data assets/products
          git status --short data assets/products
          if git diff --cached --quiet; then
            echo "::warning::스테이징된 변경이 없다 — 수집 결과가 저장되지 않았을 수 있다"
          else
            git commit -m "trends: $(date +%F) 제품 스냅샷 + 상품 이미지"
            git pull --rebase --autostash origin main && git push origin main
          fi
